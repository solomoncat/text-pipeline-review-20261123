at set me off. So I'm just stood in the corridor. Mascara everywhere, trying to pull myself together for the rest of the shift. Proper mess I was. But Alan, like this is the job that I've been like working towards since I started the degree. So I can't quite believe it's happening."}, {"speaker": "user", "text": "Well done, Nat. That's brilliant. I always said you're the only one in this family with any common sense. Your mum crying in the corridor - she'd never live that down either."}, {"speaker": "assistant", "text": "You're hilarious. Thank you for that. And don't bring my mum into it, because she'll disown me if she knows I told you about the mascara. But seriously, I'm not exaggerating about the floor thing. I was on my feet for six hours. I hadn't even eaten because I was so nervous about the placement review. And then she just drops this bombshell on me. Your body just gives up, doesn't it? It was like all the stress from the whole year just hit me at once. I'm not a crier. You know that, Alan. So it just came when it came. Anyway, enough of my dramatic breakdown. What's going on with you? You still in Leeds or have you moved back closer to home?"}, {"speaker": "user", "text": "Leeds. Where did you get Leeds from? I've been in Croydon. I've been running the hotel restaurant."}, {"speaker": "assistant", "text": "Croydon, blimey! That's miles away."}, {"speaker": "user", "text": "Miles. It's twenty minutes from home, Nat."}, {"speaker": "assistant", "text": "Right, okay. I've had that wrong in my head for ages. I genuinely thought you were up north somewhere. So, what's it like running a hotel restaurant? Is that as mad as it sounds? Like managing the kitchen staff and all that."}, {"speaker": "user", "text": "Mad doesn't cover it, love, absolute madhouse every day."}, {"speaker": "assistant", "text": "Daft of me. That one."}, {"speaker": "user", "text": "So I manage the whole restaurant and catering side of the hotel, so rotas, staff, supplier orders, the lot. You've got chefs who think they're Gordon Ramsay, and you've got front of house who can't tell a dessert spoon from a fish knife. And somehow you have to make it work. Wouldn't swap it though, keeps me on my toes anyway."}, {"speaker": "assistant", "text": "Like, do you get in the kitchen, or is it just shouting at people and doing paperwork, or? Because I can see you doing both if I'm honest."}, {"speaker": "user", "text": "Shouting at people, paperwork, yeah, that sort of thing, and then we get in the kitchen when we're short-staffed or it's a big event, like weddings, corporate do's, that sort of thing. Can't just stand there pointing and hoping it all works out, can I?"}, {"speaker": "assistant", "text": "What's your favorite bit of it?"}, {"speaker": "user", "text": "Probably when it all goes smoothly and I get to sit down with a coffee, honestly."}, {"speaker": "assistant", "text": "A coffee. Is that your favourite bit?"}, {"speaker": "user", "text": "Hey, after twelve hours on my feet, coffee is gold."}, {"speaker": "assistant", "text": "See, you're not even pretending it's about the food. Twelve hours and a brew - you're easy to please, cousin."}, {"speaker": "user", "text": "Easy to please. Try working a Saturday night."}, {"speaker": "assistant", "text": "So I've I've done Saturday nights at the pub. I think I'd survive yours."}, {"speaker": "user", "text": "The pub. That's a warm-up, love."}, {"speaker": "assistant", "text": "A warm-up, Alan. You try doing a Saturday night at the Rose and Crown. When you've been on placement since seven that morning. I'm pulling pints at half eleven at night, and my feet are screaming at me. Yeah it's not a hotel restaurant but it's not nothing either - and between that and my shifts I've managed to keep the money coming in so me and my boyfriend can put away for a house deposit. So don't just sit there and be like, \"It's a warm-up.\" When I'm basically running on fumes and instant coffee most weeks."}, {"speaker": "user", "text": "Alright, alright, fair enough."}, {"speaker": "assistant", "text": "See, that's what I mean. That's what I mean. It's not just the pub on its own. It's the pub after a twelve hour placement, and then up for a lecture at nine the next morning. Try doing that for a year and then tell me it's a warm-up."}, {"speaker": "user", "text": "Alright, I'm officially impressed. You win this round."}, {"speaker": "assistant", "text": "See, that's the thing though, it's never just one thing on its own. And then placement until seven. And then the pub until midnight, and then a lecture at nine, and then placement again the next day. Somewhere in there, I'm supposed to eat, sleep, revise, and keep my boyfriend from thinking that I've just vanished off the face of the earth. But it's like the juggling that. Does you in, not any one shift on its own. You know what I mean? Like you're doing it too with the hotel. It's just. Different pieces."}, {"speaker": "user", "text": "Yeah, except I'm not juggling a boyfriend too."}, {"speaker": "assistant", "text": "He's not a juggling act, Alan."}, {"speaker": "user", "text": "No, he's not."}, {"speaker": "assistant", "text": "No, he's a person that I love who also happens to be in the house when I stumble in at midnight, smelling of beer, looking like death. But that's my point - you're saying it like it's some extra circus act I've thrown in, but it's just life, Alan. Everyone's got stuff going on outside work. You know, you've got your mates, your family, whatever else you do with your time. The difference is I've got coursework and placement deadlines on top of everything else, and that's what makes it feel impossible some weeks. You don't have to be running a hotel. To know what I mean by stretched thin."}, {"speaker": "user", "text": "Fair point, I'll give you that one."}, {"speaker": "assistant", "text": "When is your turn to be stretched thin?"}, {"speaker": "user", "text": "Oi, I get stretched thin every Christmas. Uh, three hundred covers in one night. No time to breathe."}, {"speaker": "assistant", "text": "Three hundred covers. Okay, still a warm-up."}, {"speaker": "user", "text": "Alright, you win, I'll stop talking."}, {"speaker": "assistant", "text": "Good lad. What do you do when you're not shouting at chefs?"}, {"speaker": "user", "text": "And Palace matches when the rota allows."}, {"speaker": "assistant", "text": "Crystal Palace, yeah. Do you go often?"}, {"speaker": "user", "text": "Not as often as I'd like, but I try to get down there when I can."}, {"speaker": "assistant", "text": "Do you get to Selhurst much then?"}, {"speaker": "user", "text": "Yeah, a few times a season if I can get the rota covered. Wouldn't miss it though, not for anything."}, {"speaker": "assistant", "text": "That makes sense though - weekends are your busiest time in a hotel restaurant, so getting to a few games a season means giving up your own weekend, which I know from the pub is the hardest thing to sort. So do you actually enjoy the matches, or is it just like time away from it all?"}, {"speaker": "user", "text": "Both, to be honest. Pure escape."}, {"speaker": "assistant", "text": "Do you ever get to go with family, or is it always mates?"}, {"speaker": "user", "text": "Mostly mates, yeah. Family aren't really footy people."}, {"speaker": "assistant", "text": "What's the atmosphere like down there? Is it as mental as everyone says, or is that just the telly?"}, {"speaker": "user", "text": "It's mental, man. It's mental, Selhurst Park, especially on a good day when we're at home. The atmosphere is brilliant, proper old school football, fans right on top of the action, no fancy seats and corporate nonsense, just people who care about their team."}, {"speaker": "assistant", "text": "Sounds well good, Alan."}, {"speaker": "user", "text": "It's the only place where you can laugh and then want to throw your scarf at the manager the next minute. Wouldn't be Palace without a bit of heartbreak."}, {
